name: Audited runtime snapshot
on:
  push:
    branches: [main, codex/sanitized-source-snapshot-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python tools/verify_snapshot.py
      - run: python tools/check_publication.py
      - name: POSIX source tests
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: src:tests
        run: python -m pytest -q tests
      - name: Windows pure source tests
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_portable_interfaces.py tests/test_accepted_release_controls.py::IndependentDeepValidationControls tests/test_bounded_context_pure.py tests/test_artifact_delivery_pure.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(next(pathlib.Path('dist').glob('*.whl')))],check=True)"
      - run: python tools/run_installed.py
