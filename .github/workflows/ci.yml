name: Audited runtime snapshot
on:
  push:
    branches: [main, codex/harness-first-ci-snapshot]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python tools/verify_snapshot.py
      - name: Exact pure format and projection controls
        shell: bash
        run: PYTHONPATH=src python -m pytest -q tests/test_portable_interfaces.py tests/test_accepted_release_controls.py::IndependentDeepValidationControls
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.4.2
      - run: python tools/verify_snapshot.py
      - name: Focused provider-free source and interface integration
        shell: bash
        run: PYTHONPATH=src:tests python -m pytest -q tests

  harness-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python tools/verify_snapshot.py
      - name: Bootstrap hosting and linked-client authority
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_developer_bootstrap.py tests/test_developer_link.py tests/test_harness_link.py
